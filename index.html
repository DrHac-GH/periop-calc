<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周術期計算</title>
<meta name="description" content="γ計算・シリンジ希釈早見・輸液と経腸栄養の組成合計。計算結果は必ず指示簿と照合し、医師の確認を受けてください。">
<meta name="theme-color" content="#0E5A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="周術期計算">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1 id="app-name">周術期計算</h1>
    <div class="topbar-right">
      <div class="version" id="version" aria-live="polite">版 <b class="num">—</b>・更新日 <b class="num">—</b></div>
      <button type="button" class="btn small lang" id="lang-toggle" lang="en">English</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p class="error">この計算ツールは JavaScript を使います。ブラウザの設定で JavaScript を有効にしてください。 / This tool requires JavaScript. Please enable JavaScript in your browser settings.</p></noscript>
  <p class="note" id="loading">読み込んでいます…</p>
</main>

<nav class="tabs" aria-label="計算の切り替え">
  <div class="tabs-inner">
    <button type="button" data-tab="gamma"><span class="glyph">γ</span><span class="tab-label">γ計算</span></button>
    <button type="button" data-tab="table"><span class="glyph">▦</span><span class="tab-label">早見表</span></button>
    <button type="button" data-tab="composition"><span class="glyph">Σ</span><span class="tab-label">組成合計</span></button>
    <button type="button" data-tab="info"><span class="glyph">i</span><span class="tab-label">情報</span></button>
  </div>
</nav>

<dialog class="basis" id="basis" aria-labelledby="basis-title">
  <div class="basis-body" id="basis-body"></div>
</dialog>

<div class="update-bar" id="update-bar" hidden>
  <span id="update-text">新しい版があります</span>
  <button type="button" class="btn small" id="update-button">更新する</button>
</div>

<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
